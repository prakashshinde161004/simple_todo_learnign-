apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-deployment
  labels:
    app: todo-app
    version: "2.0"
spec:
  replicas: 3

  # Rolling Update Strategy — zero downtime deploys!
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1   # At most 1 pod can be DOWN during update
      maxSurge: 1         # At most 1 EXTRA pod can be created during update

  selector:
    matchLabels:
      app: todo-app

  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
      - name: todo-container
        image: simple-todo-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000

        # Environment variables passed to container
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"

        # Resource Limits — prevent one pod from eating all CPU/RAM
        resources:
          requests:           # minimum guaranteed resources
            memory: "64Mi"
            cpu: "100m"       # 100m = 0.1 CPU core
          limits:             # maximum allowed resources
            memory: "128Mi"
            cpu: "250m"

        # Liveness Probe — Is the app ALIVE? If fails → restart container
        livenessProbe:
          httpGet:
            path: /health     # calls http://pod:3000/health
            port: 3000
          initialDelaySeconds: 10   # wait 10s before first check
          periodSeconds: 30         # check every 30 seconds
          failureThreshold: 3       # restart after 3 failures

        # Readiness Probe — Is app READY to receive traffic?
        # If fails → remove from Service (no traffic sent)
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5    # wait 5s before first check
          periodSeconds: 10         # check every 10 seconds
          failureThreshold: 3       # remove from LB after 3 failures
