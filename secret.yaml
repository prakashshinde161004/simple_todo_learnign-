apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
type: Opaque
data:
  # Values must be base64 encoded!
  # To encode: echo -n "mypassword" | base64
  # To decode: echo "bXlwYXNzd29yZA==" | base64 -d
  DB_PASSWORD: bXlwYXNzd29yZA==     # = "mypassword"
  JWT_SECRET: c2VjcmV0a2V5MTIz     # = "secretkey123"
